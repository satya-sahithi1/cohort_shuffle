[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "cohort_shuffle"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["algorithm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
