[alembic]
# Path to migration scripts
script_location = alembic

# Database URL — overridden by env.py which reads from app/config.py
# so this value is not actually used at runtime, but alembic requires it.
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/cohort_shuffle

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
